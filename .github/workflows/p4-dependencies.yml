name: P4 dependency maintenance

on:
  push:
    branches: [maintenance/p4-dependencies-20261011]
    paths: [.github/workflows/p4-dependencies.yml]

permissions:
  contents: read
  issues: read

concurrency:
  group: p4-dependency-maintenance-20261011
  cancel-in-progress: false

jobs:
  audit:
    if: github.repository == 'Aequiludium/cocycle-rs' && github.ref == 'refs/heads/maintenance/p4-dependencies-20261011'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read exact Phase 4 issue graph
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os, urllib.request
          base = 'https://api.github.com/repos/Aequiludium/cocycle-rs'
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', 'User-Agent': 'p4-dependency-maintenance'}
          def get(path):
              req = urllib.request.Request(base + path, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)
          print('MAIN', get('/branches/main')['commit']['sha'], flush=True)
          for number in range(57, 98):
              issue = get('/issues/' + str(number))
              if 'pull_request' in issue:
                  raise RuntimeError('Unexpected pull request in Phase 4 range')
              dependencies = get('/issues/' + str(number) + '/dependencies/blocked_by?per_page=100')
              if len(dependencies) >= 100:
                  raise RuntimeError('Dependency pagination requires explicit expansion')
              body = issue.get('body') or ''
              record = {'number': number, 'id': issue['id'], 'title': issue['title'], 'state': issue['state'], 'updated_at': issue['updated_at'], 'body_sha256': hashlib.sha256(body.encode()).hexdigest(), 'parent': issue.get('parent_issue_url'), 'blocked_by': [{'number': d['number'], 'id': d['id'], 'state': d['state'], 'repository_url': d['repository_url']} for d in dependencies]}
              print('P4AUDIT ' + json.dumps(record, ensure_ascii=False), flush=True)
          print('READ_ONLY_AUDIT_COMPLETE', flush=True)
          PY
