name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  hodge-reference:
    name: Real Hodge reference comparisons
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pyt-team/TopoNetX
          ref: ce3d414b571fff95916c4cbc20b8d2c2c9d428e6
          path: target/hodge-sources/toponetx
          persist-credentials: false
          sparse-checkout: toponetx/classes
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tomogwen/persistentlaplaciandatascience
          ref: b36b080f739653d84284f3f7ca9ccea5fad286ae
          path: target/hodge-sources/perslap
          persist-credentials: false
          sparse-checkout: src
      - run: python -m pip install numpy==2.2.6 scipy==1.15.3 gudhi==3.12.0
      - name: Record source and dependency identities
        run: |
          python - <<'PY'
          import hashlib, importlib.metadata, json, os, subprocess
          from pathlib import Path
          output = Path("target/hodge-reference")
          output.mkdir(parents=True, exist_ok=True)
          references = {"toponetx":{"path":"target/hodge-sources/toponetx","file":"toponetx/classes/simplicial_complex.py"},"perslap":{"path":"target/hodge-sources/perslap","file":"src/perslap.py"}}
          for reference in references.values():
              path = Path(reference["path"])
              reference["commit"] = subprocess.check_output(["git", "-C", str(path), "rev-parse", "HEAD"], text=True).strip()
              source = path / reference["file"]
              reference["sha256"] = hashlib.sha256(source.read_bytes()).hexdigest()
          fields = ("GITHUB_SHA", "GITHUB_REF", "GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT", "GITHUB_REPOSITORY")
          record = {key: os.environ.get(key) for key in fields}
          record["checkout_sha"] = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          record["references"] = references
          record["toolchains"] = {name: subprocess.check_output([name, "--version"], text=True).strip() for name in ("cargo", "rustc")}
          record["versions"] = {name: importlib.metadata.version(name) for name in ("numpy", "scipy", "gudhi",)}
          (output / "run.json").write_text(json.dumps(record, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Run independent comparisons
        run: |
          cargo run --locked --release --example hodge_laplacian > target/hodge-reference/rust.jsonl 2> target/hodge-reference/build.log
          python tools/check_hodge.py --rust target/hodge-reference/rust.jsonl --output target/hodge-reference/results.json --iterative --toponetx target/hodge-sources/toponetx/toponetx/classes/simplicial_complex.py --perslap target/hodge-sources/perslap/src/perslap.py --gudhi 2>&1 | tee target/hodge-reference/check.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: hodge-reference-${{ github.sha }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
          path: target/hodge-reference/

  operator-reference:
    name: F2 operator reference comparisons
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: proffitteoy/homology-operator
          ref: 3daff9bd69033d1ee9c5cba5026bfff94df8d6ac
          path: target/operator-reference-source
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1
      - run: python -m pip install gudhi==3.11.0 maturin==1.15.0
      - run: maturin build --locked --release --manifest-path target/operator-reference-source/native/Cargo.toml --interpreter python --out target/operator-wheels
      - run: python -m pip install target/operator-wheels/*.whl
      - name: Isolate the actual native extension
        run: |
          python - <<'PY'
          import _homology_native
          from pathlib import Path
          import shutil
          source = Path(_homology_native.__file__)
          target = Path('target/operator-extension')
          target.mkdir()
          if source.suffix == '.py':
              shutil.copytree(source.parent, target / '_homology_native')
          else:
              shutil.copy2(source, target / source.name)
          PY
      - run: cargo build --locked --release
      - run: rustc --edition 2024 -C opt-level=3 tools/reference/homology_operator.rs --extern cocycle=target/release/libcocycle.rlib -L dependency=target/release/deps -o target/homology-worker
      - run: python tools/check_homology_operators.py --reference target/operator-reference-source --worker target/homology-worker --native-dir target/operator-extension --oracle-python python --samples 0 --output target/operator-correctness
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: operator-correctness-${{ github.sha }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 14
          path: target/operator-correctness/

  quality:
    name: Format, lint and docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python tools/check_source.py
      - run: python tools/check_artifacts.py
      - run: python tools/check_docs.py
      - run: python -m unittest discover -s tools -p 'test_*.py'
      - run: cargo fmt --all -- --check
      - run: rustfmt --edition 2024 --check tools/reference/hodge_resources.rs
      - run: rustfmt --edition 2024 --check tools/diagram_dump.rs tools/benchmark_driver.rs benches/native/cocycle.rs tools/reference/rips_cocycle.rs tools/reference/sparse_cocycle.rs tools/reference/homology_operator.rs benches/pipeline/cocycle.rs benches/distances/cocycle.rs
      - run: rustfmt --edition 2024 --config skip_children=true --check benches/optimization/cocycle.rs benches/optimization/dense_core.rs
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo build --locked
      - run: rustdoc --edition 2024 --test README.md --extern cocycle=target/debug/libcocycle.rlib -L dependency=target/debug/deps
      - run: rustdoc --edition 2024 --test docs/guides/rips.md --extern cocycle=target/debug/libcocycle.rlib -L dependency=target/debug/deps
      - run: rustdoc --edition 2024 --test docs/guides/rips-construction.md --extern cocycle=target/debug/libcocycle.rlib -L dependency=target/debug/deps
      - run: rustdoc --edition 2024 --test docs/guides/rips-representatives.md --extern cocycle=target/debug/libcocycle.rlib -L dependency=target/debug/deps
      - run: rustdoc --edition 2024 --test docs/guides/sparse-rips.md --extern cocycle=target/debug/libcocycle.rlib -L dependency=target/debug/deps
      - run: rustdoc --edition 2024 --test docs/guides/filtered-complexes.md --extern cocycle=target/debug/libcocycle.rlib -L dependency=target/debug/deps
      - run: rustdoc --edition 2024 --test docs/guides/critical-sets.md --extern cocycle=target/debug/libcocycle.rlib -L dependency=target/debug/deps
      - run: rustdoc --edition 2024 -D warnings --test docs/guides/homology-operators.md --extern cocycle=target/debug/libcocycle.rlib -L dependency=target/debug/deps
      - run: rustdoc --edition 2024 -D warnings --test docs/guides/hodge-laplacian.md --extern cocycle=target/debug/libcocycle.rlib -L dependency=target/debug/deps
      - run: rustdoc --edition 2024 -D warnings --test docs/guides/interface-contracts.md --extern cocycle=target/debug/libcocycle.rlib -L dependency=target/debug/deps
      - run: rustdoc --edition 2024 -D warnings --test docs/research/route-integration.md --extern cocycle=target/debug/libcocycle.rlib -L dependency=target/debug/deps
      - run: python tools/check_algorithm.py diagram-analysis
      - run: python tools/check_algorithm.py complex-construction
      - run: python tools/check_algorithm.py diagram-distances
      - run: python tools/check_algorithm.py persistence-reduction
      - run: cargo doc --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - run: cargo test --locked --all-features
      - run: cargo test --locked --release --all-features
      - run: cargo run --locked --example square
      - run: cargo run --locked --example rips_graph
      - run: cargo run --locked --example flag_persistence
      - run: cargo run --locked --example rips_sphere
      - run: cargo run --locked --example rips_representatives
      - run: cargo run --locked --example sparse_rips
      - run: cargo run --locked --example diagram_analysis
      - run: cargo run --locked --example complex_construction
      - run: cargo test --locked --example complex_construction
      - run: cargo test --locked --release --example complex_construction
      - run: cargo run --locked --example diagram_distances
      - run: cargo run --locked --example critical_sets
      - run: cargo run --locked --example homology_operators
      - run: cargo test --locked --example critical_sets
      - run: cargo test --locked --release --example critical_sets
      - run: cargo run --locked --example hodge_laplacian > target/hodge-rust.jsonl

  msrv:
    name: Minimum Rust (1.91)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.91.0
      - run: cargo test --locked --all-features
      - run: cargo check --locked --all-targets --all-features
      - run: cargo test --locked --example complex_construction
      - run: cargo test --locked --example critical_sets

  package:
    name: Package and packaged example
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: cargo package --locked
      - name: Check packaged examples
        shell: bash
        run: |
          package_manifest="$(cargo metadata --locked --no-deps --format-version 1 |
            python3 -c 'import json, sys
          metadata = json.load(sys.stdin)
          package = metadata["packages"][0]
          print("{}/package/{}-{}/Cargo.toml".format(metadata["target_directory"], package["name"], package["version"]))')"
          python3 tools/check_docs.py --root "$(dirname "$package_manifest")"
          for example in square diagram_analysis diagram_distances complex_construction critical_sets homology_operators; do
            cargo run --locked --manifest-path "$package_manifest" --example "$example"
          done
          cargo test --locked --manifest-path "$package_manifest" --example complex_construction
          cargo test --locked --manifest-path "$package_manifest" --example critical_sets
          cargo run --locked --manifest-path "$package_manifest" --example hodge_laplacian > target/hodge-package.jsonl

  reference:
    name: Native C++ reference comparisons
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: GUDHI/gudhi-devel
          ref: cba915e3ab8e1f5b1fe26eb44b407285f7af4e78
          path: target/native-sources/gudhi
          sparse-checkout: |
            src/common
            src/Simplex_tree
            src/Persistent_cohomology
            src/Rips_complex
            src/Collapse
            src/Subsampling
            src/Spatial_searching
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Ripser/ripser
          ref: 01add51ff64aaf40889483260cc5c3b7d0f2a1e7
          path: target/native-sources/ripser
      - run: sudo apt-get update && sudo apt-get install -y libboost-dev
      - name: Record reference run identity
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          fields = ("GITHUB_SHA", "GITHUB_REF", "GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT", "GITHUB_REPOSITORY")
          Path("target/reference-run.json").write_text(json.dumps({key: os.environ.get(key) for key in fields}, indent=2) + "\n")
          PY
      - run: python tools/benchmark_native.py --quick --samples 1 --output target/native-smoke
      - run: python tools/compare_rips.py --output target/rips-reference
      - run: python tools/compare_sparse_rips.py --output target/sparse-rips-reference
      - run: python tools/benchmark_rips_pipeline.py --quick --samples 1 --output target/rips-pipeline-smoke
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: anigmetov/oineus
          ref: e52814a1ffb5b8a81e71ff1e93b4c14194673f0f
          path: target/optimization-sources/oineus
          sparse-checkout: |
            include
            extern
      - name: Check critical-set native adapters
        shell: bash
        run: |
          cpu="$(python -c 'import os; print(min(os.sched_getaffinity(0)))')"
          python tools/benchmark_critical_sets.py --quick --samples 1 \
            --rustc "$(command -v rustc)" --cpu "$cpu" \
            --oineus-source target/optimization-sources/oineus \
            --boost-include /usr/include --output target/critical-set-smoke
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: native-reference-${{ github.sha }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            target/reference-run.json
            target/native-smoke/environment.json
            target/native-smoke/results.json
            target/native-smoke/summary.csv
            target/native-smoke/manifest-at-measurement.toml
            target/native-smoke/fixtures/
            target/native-smoke/build/build.json
            target/native-smoke/build/build.log
            target/rips-reference/environment.json
            target/rips-reference/summary.json
            target/rips-reference/results.json
            target/rips-reference/fixtures/
            target/rips-reference/build/build.log
            target/sparse-rips-reference/environment.json
            target/sparse-rips-reference/summary.json
            target/sparse-rips-reference/results.json
            target/sparse-rips-reference/fixtures/
            target/sparse-rips-reference/build/build.log
            target/rips-pipeline-smoke/environment.json
            target/rips-pipeline-smoke/summary.json
            target/rips-pipeline-smoke/results.json
            target/rips-pipeline-smoke/measurements.json
            target/rips-pipeline-smoke/fixtures/
            target/rips-pipeline-smoke/build/build.log
            target/critical-set-smoke/
            target/optimization-sources/oineus/license.txt
            target/optimization-sources/oineus/legal.txt
            target/optimization-sources/oineus/extern/taskflow/LICENSE

  distances:
    name: Native diagram-distance references
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: proffitteoy/Topp
          ref: ffa1da051ca7ac5e313c74cc9fb92a2bcb20c234
          path: target/native-sources/topp
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: GUDHI/gudhi-devel
          ref: 4ec34ac55e6d2e8cfd7c322e84c1b0a56d516d51
          path: target/native-sources/gudhi-distance
      - run: sudo apt-get update && sudo apt-get install -y libcgal-dev libboost-dev
      - run: python -m pip install gudhi==3.11.0 numpy==2.4.6 POT==0.9.6.post1
      - run: python tools/compare_distances.py --quick --output target/distance-reference
      - run: python tools/benchmark_distances.py --quick --samples 1 --groups baseline arena --families uniform sparse --sizes 8 32 --output target/distance-smoke
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: distance-reference-${{ github.sha }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            target/distance-reference/environment.json
            target/distance-reference/results.json
            target/distance-reference/summary.json
            target/distance-reference/fixtures/
            target/distance-reference/build/build.json
            target/distance-reference/build/build.log
            target/distance-smoke/environment.json
            target/distance-smoke/results.json
            target/distance-smoke/summary.json
            target/distance-smoke/measurements.json
            target/distance-smoke/fixtures/
            target/distance-smoke/build/build.json
            target/distance-smoke/build/build.log
