name: Persistent spectral references

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  persistent-spectral-reference:
    name: Persistent spectral feature reproduction
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tomogwen/persistentlaplaciandatascience
          ref: b36b080f739653d84284f3f7ca9ccea5fad286ae
          path: target/persistent-spectral-sources/perslap
          persist-credentials: false
          sparse-checkout: src
      - run: python -m pip install numpy==2.2.6 scipy==1.15.3 gudhi==3.12.0 scikit-learn==1.7.2 threadpoolctl==3.6.0
      - name: Record source and dependency identities
        run: |
          python - <<'PY'
          import hashlib, importlib.metadata, json, os, subprocess
          from pathlib import Path
          output = Path("target/persistent-spectral-reference")
          output.mkdir(parents=True, exist_ok=True)
          references = {"perslap":{"path":"target/persistent-spectral-sources/perslap","file":"src/perslap.py"}}
          for reference in references.values():
              path = Path(reference["path"])
              reference["commit"] = subprocess.check_output(["git", "-C", str(path), "rev-parse", "HEAD"], text=True).strip()
              source = path / reference["file"]
              reference["sha256"] = hashlib.sha256(source.read_bytes()).hexdigest()
          fields = ("GITHUB_SHA", "GITHUB_REF", "GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT", "GITHUB_REPOSITORY")
          record = {key: os.environ.get(key) for key in fields}
          record["checkout_sha"] = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          record["references"] = references
          record["toolchains"] = {name: subprocess.check_output([name, "--version"], text=True).strip() for name in ("cargo", "rustc")}
          record["versions"] = {name: importlib.metadata.version(name) for name in ("numpy", "scipy", "gudhi", "scikit-learn", "threadpoolctl",)}
          (output / "run.json").write_text(json.dumps(record, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Run independent comparisons
        run: |
          python -m unittest discover -s tools -p 'test_reproduce_persistent_spectral_features.py' 2>&1 | tee target/persistent-spectral-reference/tests.log
          python tools/reproduce_persistent_spectral_features.py --author-source target/persistent-spectral-sources/perslap/src/perslap.py --output target/persistent-spectral-reference/reproduction 2>&1 | tee target/persistent-spectral-reference/check.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: persistent-spectral-reference-${{ github.sha }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
          path: |
            target/persistent-spectral-reference/
            !target/persistent-spectral-reference/**/rust-build/**
