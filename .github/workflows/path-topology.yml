name: Directed path validation

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      performance:
        description: Run the full matched-output Windows performance study
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: path-topology-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  numerical:
    name: Independent real path reference
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r benches/path/requirements-lock.txt
      - run: python -m unittest discover -s tools -p 'test_path_reference.py' -v
      - run: cargo build --locked --release
      - run: rustc --edition 2024 -D warnings -C opt-level=3 tools/reference/path_real.rs --extern cocycle=target/release/libcocycle.rlib -L dependency=target/release/deps -o target/path-real-worker
      - run: python tools/check_path_real.py --worker target/path-real-worker --output target/path-real-reference
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: path-real-reference-${{ github.sha }}-${{ github.run_attempt }}
          path: target/path-real-reference/
          if-no-files-found: ignore
          retention-days: 14

  performance:
    name: Matched path H0-H1 performance
    if: github.event_name == 'workflow_dispatch' && inputs.performance
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python tools/benchmark_path_topology.py --output target/path-performance --samples 10
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: path-performance-${{ github.sha }}-${{ github.run_attempt }}
          path: target/path-performance/
          if-no-files-found: ignore
          retention-days: 14
